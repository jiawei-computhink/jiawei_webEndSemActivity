<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Power Core Runner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.8.14/planck.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.8.14/p5play.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        background: #0a1020;
        color: #eefaff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 960px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        color: #8af7ff;
        text-shadow: 0 0 14px #22dfff;
      }

      p {
        margin: 8px 0 16px;
        color: #c4cbe4;
        line-height: 1.5;
      }

      a {
        color: #ff9ee7;
      }

      canvas {
        display: block;
        width: min(100%, 900px);
        height: auto;
        margin: 0 auto;
        border: 1px solid #46eaff;
        border-radius: 10px;
        box-shadow: 0 0 24px #22dfff55;
      }

      .controls {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Power Core Runner</h1>
      <p>Raid a futuristic factory, collect all three power cores, and reach the exit!</p>
      <p class="controls">Move: Left / Right arrows &nbsp; | &nbsp; Jump: Up arrow &nbsp; | &nbsp; Fire: Space &nbsp; | &nbsp; Restart: R</p>
      <p><a href="index.html">Back to home</a></p>
    </main>
    <script src="power-core-runner.js"></script>
  </body>
</html>
