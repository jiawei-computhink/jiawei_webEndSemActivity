<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon Snake</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.8.14/planck.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.8.14/p5play.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        background: #080b19;
        color: #eefaff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 760px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        color: #72ffe0;
        text-shadow: 0 0 14px #18e7c2;
      }

      p {
        margin: 8px 0 16px;
        color: #c4cbe4;
        line-height: 1.5;
      }

      a {
        color: #ff8bdf;
      }

      canvas {
        display: block;
        width: min(100%, 720px);
        height: auto;
        margin: 0 auto;
        border: 1px solid #30f4da;
        border-radius: 12px;
        box-shadow: 0 0 24px #1acbff55;
      }

      .controls {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Neon Snake</h1>
      <p>Eat 20 glowing fruits to win. Don't hit the walls or your own tail!</p>
      <div class="controls">Move: Arrow keys &nbsp; | &nbsp; Restart: R</div>
      <p><a href="index.html">Back to home</a></p>
    </main>
    <script src="neon-snake.js"></script>
  </body>
</html>
