<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enchanted Tetris</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.8.14/planck.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5play@3.8.14/p5play.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
        background: #100b20;
        color: #f5efff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 780px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        color: #e0bdff;
        text-shadow: 0 0 14px #a448ff;
      }

      p {
        margin: 8px 0 16px;
        color: #d3c5e6;
        line-height: 1.5;
      }

      a {
        color: #ffb9f3;
      }

      canvas {
        display: block;
        width: min(100%, 760px);
        height: auto;
        margin: 0 auto;
        border: 1px solid #bd7aff;
        border-radius: 12px;
        box-shadow: 0 0 24px #a448ff55;
      }

      .controls {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Enchanted Tetris</h1>
      <p>Arrange enchanted runes, clear 10 lines, and set a new high score!</p>
      <div class="controls">Move: Arrow keys &nbsp; | &nbsp; Rotate: L &nbsp; | &nbsp; Drop: Space &nbsp; | &nbsp; Restart: R</div>
      <p><a href="index.html">Back to home</a></p>
    </main>
    <script src="enchanted-tetris.js"></script>
  </body>
</html>
